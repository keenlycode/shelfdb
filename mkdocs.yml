site_name: ShelfDB
site_description: Usage documentation for ShelfDB
site_url: https://keenlycode.github.io/shelfdb/
repo_url: https://github.com/keenlycode/shelfdb

theme:
  custom_dir: overrides

# MkDocs-compatible configuration while transitioning to Zensical.
docs_dir: docs-src
site_dir: docs
nav:
  - Overview:
      - ShelfDB: index.md
      - Installation: usage/installation.md
  - Guides:
      - Run the server: usage/server.md
      - Remote client usage: usage/remote.md
      - Local database usage: usage/local.md
      - Benchmark: benchmark.md
  - API Reference:
      - API overview: api/index.md
      - Client API: api/client.md
      - Local DB API: api/local.md
      - CLI Reference: api/cli.md

extra:
  version:
    provider: mike
    default: latest
    alias: true
  version_selector_fallback: development

extra_css:
  - assets/stylesheets/version-badge.css
markdown_extensions:
  - zensical.extensions.macros:
      module_name: macros
  - admonition
  - attr_list
  - fenced_code
  - codehilite
  - toc:
      permalink: true
  - pymdownx.inlinehilite
