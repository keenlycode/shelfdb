[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "shelfdb"
version = "3.0.1"
description = "A tiny database for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nitipit Nontasuwan", email = "nitipit@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "cyclopts>=4.10.2,<5",
    "dill>=0.4.0,<0.5",
    "lmdb>=1.7.3,<2",
    "msgpack>=1.2.1,<2",
]

[project.scripts]
shelfdb = "shelfdb.cli:main"

[project.urls]
Documentation = "https://keenlycode.github.io/shelfdb/"
Repository = "https://github.com/keenlycode/shelfdb"

[dependency-groups]
dev = [
    "zensical==0.0.52",
    "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
    "pytest-cov>=7.0.0,<8",
    "pytest>=9.0.0,<10",
    "ruff>=0.13.0,<0.14",
    "tinydb>=4.8.2,<5",
    "ty>=0.0.1a17,<0.0.2",
]

[tool.uv.build-backend]
module-name = "shelfdb"
module-root = "src"
data = { data = "ai-skill" }
source-include = ["ai-skill/**"]
